[package]
name = "touchdeck-server"
version = "0.12.1"
edition = "2024"
description = "TouchDeck-Server: Makro-Fernbedienung für Linux"
license = "MIT"

[[bin]]
name = "touchdeck-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
hex = "0.4.3"
if-addrs = "0.15.0"
indexmap = { version = "2.14.2", features = ["serde"] }
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
socket2 = "0.6"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

# Linux: X11 (Tastatur, Fenster, Zwischenablage) und Systemaufrufe.
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
x11-dl = "2.21.0"

# Windows: offizielle Bibliothek von Microsoft (Tastatur, Fenster, Zwischenablage, Ton, Systemwerte).
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Shutdown",
  "Win32_Storage_FileSystem",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
]
