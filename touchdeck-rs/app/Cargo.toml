[package]
name = "touchdeck"
version = "0.7.0"
edition = "2024"
description = "TouchDeck – Makro-Fernbedienung für Linux"
license = "MIT"
default-run = "touchdeck"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.3"
tokio = { version = "1.53.3", features = ["full"] }
touchdeck-server = { path = "../server" }
