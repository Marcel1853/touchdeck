<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TouchDeck</title>
  <link rel="icon" href="/shared/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="/shared/button.css">
  <link rel="stylesheet" href="deck.css">
</head>
<body>
  <header id="bar">
    <button id="back" class="bar-btn" title="Zurück" data-i18n-title="deck.back" hidden>‹</button>
    <button id="page-name" title="Seite wählen" data-i18n-title="deck.choosePage">TouchDeck</button>
    <span id="status" class="dot" title="Verbindung" data-i18n-title="deck.connection"></span>
    <button id="fullscreen" class="bar-btn" title="Vollbild" data-i18n-title="deck.fullscreen">⛶</button>
  </header>
  <main id="wrap"><div id="grid" class="td-grid"></div></main>
  <footer id="foot">
    <span id="foot-dot" class="dot"></span>
    <span id="foot-text"></span>
    <button id="foot-switch" class="foot-btn" data-i18n="deck.switchPc" hidden>⇄ PC wechseln</button>
  </footer>
  <div id="rotate-hint" data-i18n="deck.holdPhoneSidewaysFor">↻ Für diese Seite das Gerät quer halten</div>
  <div id="overlay">
    <div class="overlay-box">
      <div class="spinner"></div>
      <div id="overlay-text" data-i18n="deck.connectingToPc">Verbinde mit dem PC …</div>
    </div>
  </div>
  <div id="pin-box" hidden>
    <form id="pin-form" class="overlay-box">
      <div style="font-size:34px">🔐</div>
      <div id="pin-hint" data-i18n="deck.thisPcIsProtected">Dieser PC ist mit einer PIN geschützt.</div>
      <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="PIN">
      <button type="submit" data-i18n="deck.connect">Verbinden</button>
    </form>
  </div>
  <div id="page-menu" hidden><div class="menu-box" id="page-menu-list"></div></div>
  <div id="toast"></div>
  <!-- Ruhezustand: abdunkeln, Uhr oder schwarz; der erste Tipp weckt nur. -->
  <div id="sleep" hidden><div id="sleep-clock"></div></div>
  <!-- PC gesperrt: Bedienfeld gesperrt, bis der PC entsperrt ist. -->
  <div id="pclock" hidden><div class="overlay-box"><div class="pclock-icon">🔒</div><div data-i18n="deck.pcLocked">PC gesperrt</div></div></div>
  <script type="module" src="/shared/boot.js" data-main="/deck/deck.js"></script>
</body>
</html>
