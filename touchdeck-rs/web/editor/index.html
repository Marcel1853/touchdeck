<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TouchDeck Editor</title>
  <link rel="icon" href="/shared/icon.svg">
  <link rel="stylesheet" href="/shared/button.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">▦</span> TouchDeck</div>
    <div id="save-state" class="save-state" data-i18n="editor.loading">Lädt …</div>
    <div class="topbar-actions">
      <button class="btn ghost" id="undo" title="Rückgängig (Strg+Z)" data-i18n-title="editor.undoCtrlZ">↶</button>
      <button class="btn ghost" id="redo" title="Wiederholen (Strg+Y)" data-i18n-title="editor.redoCtrlY">↷</button>
      <button class="btn" id="open-preview" data-i18n="editor.preview">Vorschau</button>
      <button class="btn primary" id="open-pair" data-i18n="editor.connectPhone2">📱 Handy verbinden</button>
    </div>
  </header>

  <nav id="rail" class="rail" aria-label="Bereiche" data-i18n-aria-label="editor.sections"></nav>
  <main id="view" class="view"></main>
  <footer id="statusbar" class="statusbar"></footer>

  <dialog id="dlg-pair" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2 data-i18n="editor.connectPhone">Handy verbinden</h2>
      <p><b data-i18n="editor.withTouchdeckApp">Mit der TouchDeck-App:</b> <span data-i18n="editor.openAppItFinds">App öffnen – sie findet diesen PC von selbst, du bestätigst hier.</span> <b data-i18n="editor.withoutApp">Ohne App:</b> <span data-i18n="editor.scanThisCodeWith">diesen Code mit der Handykamera scannen, das Bedienfeld öffnet sich im Browser.</span></p>
      <div id="pair-qr" class="qr"></div>
      <div id="pair-urls" class="pair-urls"></div>
      <div id="pair-app" class="pair-app"></div>
      <label class="switch-row"><input type="checkbox" id="pair-lan"> <span data-i18n="common.allowAccessFromWi">Zugriff aus dem WLAN erlauben</span></label>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="pair-settings" data-i18n="editor.securityPin">Sicherheit &amp; PIN …</button>
        <div class="spacer"></div>
        <button class="btn primary" data-i18n="common.done">Fertig</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-ask" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2 id="ask-title"></h2>
      <p id="ask-text"></p>
      <div class="dialog-actions" id="ask-buttons"></div>
    </form>
  </dialog>

  <div id="toasts" class="toasts"></div>
  <script type="module" src="/shared/boot.js" data-main="/editor/js/main.js"></script>
</body>
</html>
